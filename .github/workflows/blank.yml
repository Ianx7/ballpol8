# mod_config.yaml
name: "8Ball Pool Mod"
version: "1.0"
target_bundle: "com.miniclip.eightballpool"

options:
  - id: long_line
    name: "Long Line Guideline"
    type: toggle
    default: false
    description: "Extiende la línea de tiro para tiros perfectos."

  - id: anti_ban
    name: "Anti-Ban Protection"
    type: toggle
    default: true
    description: "Oculta los logs de detección del servidor."

  - id: infinite_money
    name: "Infinite Money"
    type: toggle
    default: false
    description: "Dinero infinito al entrar a una partida."

settings:
  menu_color: "#00ffcc"
  trigger: triple_tap
  position: top_right
